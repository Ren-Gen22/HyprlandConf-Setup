#################################
#          Backend              #
#################################
backend = "glx";
glx-no-stencil = true;
glx-no-rebind-pixmap = true;
vsync = true;

#################################
#          Shadows              #
#################################
shadow = true;
shadow-radius = 10;
shadow-offset-x = -5;
shadow-offset-y = -5;
shadow-opacity = 0.2;
shadow-exclude = [
  "name = 'Notification'",
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c",
  "window_type = 'dock'"
];

#################################
#           Fading              #
#################################
fading = false;  # <== DISABLED for instant switching
fade-in-step = 0.05;
fade-out-step = 0.05;

#################################
#   Transparency / Opacity      #
#################################
inactive-opacity = 0.95;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;

focus-exclude = [
  "class_g = 'i3-frame'",
  "class_g = 'Bar'"
];

opacity-rule = [
  "85:class_g = 'Kitty' && focused",
  "60:class_g = 'Kitty' && !focused",
  "100:class_g = 'firefox'"
];

#################################
#     Background Blur           #
#################################
# Blur is GPU intensive — disable for performance
blur: {
  method = "none";  # <== DISABLED
}

blur-background-exclude = [];

#################################
#       General Settings        #
#################################
detect-rounded-corners = true;
detect-client-opacity = true;
mark-wmwin-focused = true;
mark-ovredir-focused = true;
unredir-if-possible = false;
detect-transient = true;
use-damage = true;
log-level = "warn";

#################################
#    Window Type Settings       #
#################################
wintypes:
{
  tooltip = { fade = false; shadow = false; opacity = 0.95; focus = true; };
  dock = { shadow = false; blur-background = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};

